name: weather_with_flutter
description: "Simple project to demonstrate my flutter skills"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  uuid: ^4.6.0
  logger: ^2.8.0
  drift: ^2.35.1
  path_provider: ^2.1.6
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0

flutter:
  # Generates lib/l10n/app_localizations*.dart from the ARB files (l10n.yaml).
  generate: true
  uses-material-design: true
  assets:
    - lib/assets/